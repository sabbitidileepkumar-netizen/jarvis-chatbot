/* =========================================================
   J.A.R.V.I.S — FUTURISTIC AI INTERFACE
   ========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --bg: #05080c;
    --panel: #091018;
    --panel2: #0c141d;
    --line: rgba(95, 212, 255, .16);
    --line-bright: rgba(95, 212, 255, .55);
    --cyan: #5fd4ff;
    --cyan2: #8ee7ff;
    --text: #dcecf5;
    --muted: #647888;
    --green: #55d68a;
    --red: #ff6570;
    --shadow: 0 0 35px rgba(95, 212, 255, .08);
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    background:
        radial-gradient(circle at 50% 45%, rgba(40, 130, 170, .08), transparent 35%),
        var(--bg);
    color: var(--text);
    font-family: "Courier New", Consolas, monospace;
    overflow: hidden;
}

/* =========================================================
   BACKGROUND
   ========================================================= */

.grid-bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    opacity: .08;

    background-image:
        linear-gradient(rgba(95,212,255,.22) 1px, transparent 1px),
        linear-gradient(90deg, rgba(95,212,255,.22) 1px, transparent 1px);

    background-size: 42px 42px;

    mask-image: linear-gradient(to bottom, black, transparent);
}

.scanlines {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1000;

    background: repeating-linear-gradient(
        to bottom,
        transparent 0,
        transparent 3px,
        rgba(255,255,255,.012) 4px
    );
}

.background-glow {
    position: fixed;
    width: 400px;
    height: 400px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: rgba(95,212,255,.025);
    filter: blur(80px);
    pointer-events: none;
}

/* =========================================================
   LOGIN
   ========================================================= */

#loginScreen {
    position: fixed;
    inset: 0;
    z-index: 9999;

    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;

    background:
        radial-gradient(circle at center, rgba(45,130,170,.12), transparent 35%),
        #05080c;

    transition: opacity .5s ease;
}

#loginScreen.hidden {
    opacity: 0;
    pointer-events: none;
}

.login-reactor {
    position: relative;
    width: 105px;
    height: 105px;
    margin-bottom: 25px;

    display: flex;
    align-items: center;
    justify-content: center;
}

.login-reactor::before,
.login-reactor::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 1px solid var(--line-bright);
}

.login-reactor::before {
    animation: reactorSpin 8s linear infinite;
}

.login-reactor::after {
    inset: 13px;
    border-color: rgba(95,212,255,.25);
    animation: reactorSpinReverse 5s linear infinite;
}

.reactor-core {
    width: 36px;
    height: 36px;
    border-radius: 50%;

    background: radial-gradient(circle, #e8fbff 0%, var(--cyan) 35%, #17627b 70%, transparent 72%);

    box-shadow:
        0 0 15px var(--cyan),
        0 0 40px rgba(95,212,255,.55);

    animation: reactorPulse 2s ease-in-out infinite;
}

@keyframes reactorSpin {
    to { transform: rotate(360deg); }
}

@keyframes reactorSpinReverse {
    to { transform: rotate(-360deg); }
}

@keyframes reactorPulse {
    0%,100% { transform: scale(.9); opacity: .75; }
    50% { transform: scale(1.08); opacity: 1; }
}

.login-title {
    font-size: 28px;
    letter-spacing: 9px;
    color: #edfaff;
    text-shadow: 0 0 20px rgba(95,212,255,.3);
}

.login-sub {
    margin-top: 8px;
    font-size: 9px;
    letter-spacing: 3px;
    color: var(--muted);
}

.login-line {
    width: 90px;
    height: 1px;
    margin: 22px 0;
    background: linear-gradient(90deg, transparent, var(--cyan), transparent);
}

.login-msg {
    margin-bottom: 25px;
    color: #668799;
    font-size: 9px;
    letter-spacing: 2px;
}

.google-btn {
    display: inline-flex;
    align-items: center;
    gap: 12px;

    padding: 13px 24px;

    color: var(--text);
    text-decoration: none;
    font-size: 10px;
    letter-spacing: 2px;

    background: rgba(10,17,24,.9);
    border: 1px solid var(--line);

    transition: .25s;
}

.google-btn:hover {
    border-color: var(--cyan);
    box-shadow: 0 0 20px rgba(95,212,255,.12);
    transform: translateY(-2px);
}

.google-btn img {
    width: 16px;
    height: 16px;
}

.login-footer {
    margin-top: 35px;
    font-size: 8px;
    color: #405361;
    letter-spacing: 1px;
}

/* =========================================================
   SPLASH
   ========================================================= */

#splash {
    position: fixed;
    inset: 0;
    z-index: 9998;

    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;

    background: #05080c;
}

#splash.hidden {
    display: none;
}

.boot-ring {
    width: 65px;
    height: 65px;

    border-radius: 50%;
    border: 2px solid #162631;
    border-top-color: var(--cyan);

    animation: spin 1s linear infinite;

    margin-bottom: 20px;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

.boot-status {
    color: var(--cyan);
    font-size: 9px;
    letter-spacing: 2px;
}
