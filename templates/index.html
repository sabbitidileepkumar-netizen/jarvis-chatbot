<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#03070b">

<title>J.A.R.V.I.S — AI Assistant</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.2/marked.min.js"></script>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
    --bg: #03070b;
    --cyan: #55d9ff;
    --cyan2: #9beaff;
    --text: #dceff7;
    --muted: #617783;
    --green: #54e59a;
    --red: #ff6470;
    --line: rgba(85,217,255,.16);
    --line-bright: rgba(85,217,255,.55);
}

html, body { width: 100%; height: 100%; }

body {
    background: radial-gradient(circle at 50% 48%, rgba(40,140,180,.08), transparent 35%), var(--bg);
    color: var(--text);
    font-family: "Courier New", Consolas, monospace;
    overflow: hidden;
}

.grid-bg {
    position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: .11;
    background-image:
        linear-gradient(rgba(85,217,255,.18) 1px, transparent 1px),
        linear-gradient(90deg, rgba(85,217,255,.18) 1px, transparent 1px);
    background-size: 42px 42px;
    mask-image: linear-gradient(to bottom, black, transparent 90%);
}

.scanlines {
    position: fixed; inset: 0; z-index: 1000; pointer-events: none;
    background: repeating-linear-gradient(to bottom, transparent 0, transparent 3px, rgba(255,255,255,.012) 4px);
}

.background-glow {
    position: fixed; width: 450px; height: 450px; left: 50%; top: 50%;
    transform: translate(-50%, -50%); border-radius: 50%;
    background: rgba(85,217,255,.035); filter: blur(90px); pointer-events: none;
}

/* LOGIN */
#loginScreen {
    position: fixed; inset: 0; z-index: 9999;
    display: flex; align-items: center; justify-content: center; flex-direction: column;
    background: radial-gradient(circle at center, rgba(45,130,170,.13), transparent 36%), #03070b;
    transition: opacity .5s ease;
}
#loginScreen.hidden { opacity: 0; pointer-events: none; }

.login-reactor { position: relative; width: 110px; height: 110px; margin-bottom: 25px; display: flex; align-items: center; justify-content: center; }
.login-reactor::before, .login-reactor::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 1px solid var(--line-bright); }
.login-reactor::before { animation: reactorSpin 8s linear infinite; }
.login-reactor::after { inset: 14px; border-color: rgba(85,217,255,.25); animation: reactorSpinReverse 5s linear infinite; }

.reactor-core {
    width: 38px; height: 38px; border-radius: 50%;
    background: radial-gradient(circle, white 0%, var(--cyan) 35%, #17627b 70%, transparent 72%);
    box-shadow: 0 0 15px var(--cyan), 0 0 40px rgba(85,217,255,.55);
    animation: reactorPulse 2s ease-in-out infinite;
}

@keyframes reactorSpin { to { transform: rotate(360deg); } }
@keyframes reactorSpinReverse { to { transform: rotate(-360deg); } }
@keyframes reactorPulse { 0%,100% { transform: scale(.9); opacity: .75; } 50% { transform: scale(1.08); opacity: 1; } }

.login-title { font-size: 28px; letter-spacing: 9px; color: #edfaff; text-shadow: 0 0 20px rgba(85,217,255,.3); }
.login-sub { margin-top: 8px; font-size: 9px; letter-spacing: 3px; color: var(--muted); }
.login-line { width: 90px; height: 1px; margin: 22px 0; background: linear-gradient(90deg, transparent, var(--cyan), transparent); }
.login-msg { margin-bottom: 25px; color: #668799; font-size: 9px; letter-spacing: 2px; text-align: center; }

.google-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 12px;
    padding: 13px 24px; color: var(--text); text-decoration: none; font-size: 10px; letter-spacing: 2px;
    background: rgba(10,17,24,.9); border: 1px solid var(--line); cursor: pointer; transition: .25s;
}
.google-btn:hover { border-color: var(--cyan); box-shadow: 0 0 20px rgba(85,217,255,.12); transform: translateY(-2px); }
.google-btn img { width: 16px; height: 16px; }

.login-footer { margin-top: 35px; font-size: 8px; color: #405361; letter-spacing: 1px; }

/* SPLASH */
#splash { position: fixed; inset: 0; z-index: 9998; display: flex; align-items: center; justify-content: center; flex-direction: column; background: #03070b; }
#splash.hidden { display: none; }
.boot-ring { width: 60px; height: 60px; border-radius: 50%; border: 2px solid #162631; border-top-color: var(--cyan); animation: spin 1s linear infinite; margin-bottom: 20px; }
@keyframes spin { to { transform: rotate(360deg); } }
.boot-status { color: var(--cyan); font-size: 9px; letter-spacing: 2px; }

/* APP */
.app { position: relative; z-index: 2; display: none; width: 100%; height: 100dvh; }
.app.active { display: flex; }

/* SIDEBAR */
.sidebar {
    width: 250px; height: 100%; flex-shrink: 0; display: flex; flex-direction: column;
    background: linear-gradient(180deg, rgba(11,19,27,.98), rgba(5,10,15,.98));
    border-right: 1px solid var(--line);
}

.avatar-box { padding: 23px 18px 18px; display: flex; flex-direction: column; align-items: center; border-bottom: 1px solid var(--line); }
.avatar {
    width: 58px; height: 58px; display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--line-bright); border-radius: 50%;
    background: radial-gradient(circle, rgba(85,217,255,.16), #09131c);
    color: var(--cyan); box-shadow: 0 0 20px rgba(85,217,255,.1); margin-bottom: 10px; font-size: 22px; overflow: hidden;
}
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.avatar-name { max-width: 190px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); font-size: 10px; font-weight: bold; letter-spacing: 2px; }
.avatar-status { margin-top: 5px; color: var(--green); font-size: 8px; letter-spacing: 1px; }
.logout-btn { margin-top: 9px; color: #536875; font-size: 8px; letter-spacing: 1px; text-decoration: underline; cursor: pointer; }
.logout-btn:hover { color: var(--red); }

.new-chat-btn {
    margin: 15px 14px 7px; padding: 11px; text-align: center; color: var(--cyan);
    background: rgba(15,28,38,.7); border: 1px solid var(--line); font-size: 9px; letter-spacing: 2px;
    cursor: pointer; transition: .2s;
}
.new-chat-btn:hover { border-color: var(--cyan); box-shadow: 0 0 15px rgba(85,217,255,.08); }

.nav-section-label { padding: 15px 18px 7px; color: #405563; font-size: 8px; letter-spacing: 2px; }

.nav-btn {
    width: 100%; padding: 11px 18px; display: flex; align-items: center; gap: 11px;
    color: #708593; background: transparent; border: none; border-left: 2px solid transparent;
    text-align: left; font-family: inherit; font-size: 9px; letter-spacing: 1px; cursor: pointer; transition: .2s;
}
.nav-btn:hover { color: var(--text); background: rgba(85,217,255,.025); }
.nav-btn.active { color: var(--cyan); background: rgba(85,217,255,.05); border-left-color: var(--cyan); }
.nav-icon { width: 15px; text-align: center; }

.conv-list { flex: 1; overflow-y: auto; padding: 5px 9px; }
.conv-list::-webkit-scrollbar, .messages::-webkit-scrollbar, .content-pad::-webkit-scrollbar { width: 4px; }
.conv-list::-webkit-scrollbar-thumb, .messages::-webkit-scrollbar-thumb, .content-pad::-webkit-scrollbar-thumb { background: #28566c; }

.conv-item { display: flex; align-items: center; margin-bottom: 2px; padding: 9px; color: #687c89; font-size: 9px; border-left: 2px solid transparent; cursor: pointer; }
.conv-item:hover { color: var(--text); background: rgba(255,255,255,.025); }
.conv-item.active { color: var(--cyan); background: rgba(85,217,255,.04); border-left-color: var(--cyan); }
.conv-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.conv-del { margin-left: 7px; color: #42535e; cursor: pointer; }
.conv-del:hover { color: var(--red); }

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

.header {
    height: 64px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
    padding: 0 28px; background: rgba(7,14,21,.92); border-bottom: 1px solid var(--line); backdrop-filter: blur(12px);
}
.header-left { display: flex; align-items: center; gap: 13px; }
.header-reactor {
    width: 29px; height: 29px; border-radius: 50%; border: 1px solid var(--line-bright);
    display: flex; align-items: center; justify-content: center; box-shadow: 0 0 12px rgba(85,217,255,.15);
    animation: headerPulse 2s infinite;
}
.header-reactor::after { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 10px var(--cyan); }
@keyframes headerPulse { 50% { box-shadow: 0 0 22px rgba(85,217,255,.28); } }

.logo { color: #edfaff; font-size: 15px; font-weight: bold; letter-spacing: 5px; }
.subtitle { margin-top: 3px; color: #536875; font-size: 7px; letter-spacing: 2px; }
.status { display: flex; align-items: center; gap: 7px; color: var(--cyan); font-size: 8px; letter-spacing: 1px; }
.status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 9px var(--green); animation: onlinePulse 1.7s infinite; }
@keyframes onlinePulse { 50% { opacity: .45; } }

.panel { flex: 1; min-height: 0; display: none; flex-direction: column; position: relative; }
.panel.active { display: flex; }

.messages { flex: 1; min-height: 0; overflow-y: auto; padding: 25px clamp(16px, 8vw, 100px) 18px; }

.welcome { min-height: 100%; display: flex; align-items: center; justify-content: center; text-align: center; }
.welcome-inner { width: 100%; }
.welcome-core {
    width: 115px; height: 115px; margin: 0 auto 24px; display: flex; align-items: center; justify-content: center;
    border-radius: 50%; border: 1px solid rgba(85,217,255,.38);
    box-shadow: inset 0 0 30px rgba(85,217,255,.04), 0 0 30px rgba(85,217,255,.08);
    animation: welcomeFloat 4s ease-in-out infinite;
}
.welcome-core::before {
    content: ""; width: 60px; height: 60px; border-radius: 50%;
    background: radial-gradient(circle, white 0%, var(--cyan) 25%, #12627d 60%, transparent 70%);
    box-shadow: 0 0 20px var(--cyan), 0 0 60px rgba(85,217,255,.3);
}
@keyframes welcomeFloat { 50% { transform: translateY(-7px); } }
.welcome h1 { color: #e9faff; font-size: 22px; letter-spacing: 6px; }
.welcome p { margin-top: 10px; color: #536b79; font-size: 9px; letter-spacing: 1px; }

.message {
    width: fit-content; max-width: min(780px, 92%); margin-bottom: 17px; padding: 13px 16px; position: relative;
    background: rgba(10,16,23,.92); border: 1px solid var(--line); line-height: 1.65; font-size: 13px;
    animation: messageIn .25s ease;
}
@keyframes messageIn { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }
.message.ai { margin-right: auto; border-left: 2px solid var(--cyan); }
.message.user { margin-left: auto; border-right: 2px solid #547ca0; background: rgba(14,20,27,.95); }

.msg-top { display: flex; justify-content: space-between; gap: 25px; margin-bottom: 7px; }
.sender { color: var(--cyan); font-size: 8px; letter-spacing: 2px; }
.message.user .sender { color: #83a8c5; }
.msg-time { color: #3d505c; font-size: 8px; }
.msg-body { overflow-wrap: anywhere; }
.msg-body p { margin-bottom: 8px; }
.msg-body p:last-child { margin-bottom: 0; }
.msg-body ul, .msg-body ol { padding-left: 22px; margin: 8px 0; }
.msg-body li { margin: 4px 0; }
.msg-body a { color: var(--cyan); }
.msg-body strong { color: #f0fbff; }
.message pre { margin: 10px 0; padding: 13px; overflow-x: auto; background: #030609; border: 1px solid rgba(85,217,255,.1); border-radius: 3px; }
.message code { font-size: 11px; }
.message :not(pre) > code { padding: 2px 5px; background: rgba(85,217,255,.08); color: var(--cyan2); }
.message img.attached { display: block; max-width: min(300px, 100%); max-height: 280px; margin-top: 10px; border: 1px solid var(--line); border-radius: 3px; }

.msg-actions { display: flex; gap: 13px; margin-top: 9px; padding-top: 7px; border-top: 1px solid rgba(85,217,255,.07); color: #405663; font-size: 8px; letter-spacing: 1px; }
.msg-actions span { cursor: pointer; }
.msg-actions span:hover { color: var(--cyan); }

.typing-message {
    width: fit-content; margin-bottom: 17px; padding: 13px 16px; border-left: 2px solid var(--cyan);
    border-top: 1px solid var(--line); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
    background: rgba(10,16,23,.92);
}
.typing-label { margin-bottom: 7px; color: #4d7487; font-size: 8px; letter-spacing: 2px; }
.typing-dots { display: flex; gap: 5px; }
.typing-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--cyan); animation: typing 1.2s infinite; }
.typing-dot:nth-child(2) { animation-delay: .2s; }
.typing-dot:nth-child(3) { animation-delay: .4s; }
@keyframes typing { 0%,60%,100% { opacity: .25; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-4px); } }

#imgPreviewBar { display: none; align-items: center; gap: 10px; padding: 0 clamp(16px, 8vw, 100px) 8px; }
#imgPreviewBar img { width: 46px; height: 46px; object-fit: cover; border: 1px solid var(--line); }
#imgPreviewBar span { color: var(--red); font-size: 8px; letter-spacing: 1px; cursor: pointer; }

.input-area { flex-shrink: 0; display: flex; gap: 7px; padding: 11px clamp(16px, 8vw, 100px) 20px; background: linear-gradient(to top, #03070b 75%, transparent); }
.input-box { flex: 1; min-width: 0; display: flex; align-items: center; background: #091018; border: 1px solid var(--line); transition: .2s; }
.input-box:focus-within { border-color: var(--line-bright); box-shadow: 0 0 18px rgba(85,217,255,.06); }
#messageInput { width: 100%; padding: 13px 14px; color: var(--text); background: transparent; border: none; outline: none; font-family: inherit; font-size: 13px; }
#messageInput::placeholder { color: #40535f; }

.action-btn, .send { flex-shrink: 0; cursor: pointer; transition: .2s; border: none; font-family: inherit; }
.action-btn { width: 45px; color: var(--cyan); background: #0a131b; border: 1px solid var(--line); font-size: 14px; }
.action-btn:hover { border-color: var(--cyan); background: #0e1d27; }
.mic-btn.listening { color: var(--red); border-color: var(--red); box-shadow: 0 0 14px rgba(255,101,112,.12); animation: micPulse 1s infinite; }
@keyframes micPulse { 50% { box-shadow: 0 0 25px rgba(255,101,112,.25); } }

.send { width: 50px; color: var(--cyan); background: #103043; border: 1px solid var(--line-bright); font-size: 18px; }
.send:hover { background: #17445b; box-shadow: 0 0 20px rgba(85,217,255,.12); }
.send:disabled { opacity: .35; cursor: not-allowed; }

.content-pad { flex: 1; overflow-y: auto; padding: 28px clamp(16px, 8vw, 100px); }
.panel-title { margin-bottom: 7px; color: var(--cyan); font-size: 11px; letter-spacing: 3px; }
.panel-subtitle { margin-bottom: 25px; color: #4d6573; font-size: 8px; letter-spacing: 1px; }

.mem-item { max-width: 750px; display: flex; align-items: center; justify-content: space-between; gap: 15px; padding: 12px; border-bottom: 1px solid var(--line); border-left: 2px solid #172832; font-size: 11px; }
.mem-item b { color: var(--cyan); }
.mem-delete { color: #435864; cursor: pointer; }
.mem-delete:hover { color: var(--red); }

.item-add { max-width: 750px; display: flex; gap: 6px; margin-top: 18px; flex-wrap: wrap; }
.item-add input { flex: 1; min-width: 120px; padding: 11px; color: var(--text); background: #091018; border: 1px solid var(--line); outline: none; font-family: inherit; font-size: 11px; }
.item-add button { width: 45px; color: var(--cyan); background: #103043; border: 1px solid var(--line-bright); cursor: pointer; }

.setting { max-width: 750px; margin-bottom: 20px; padding: 15px; background: rgba(9,16,24,.75); border: 1px solid var(--line); }
.setting-title { margin-bottom: 8px; color: var(--cyan); font-size: 9px; letter-spacing: 2px; }
.setting-desc { margin-bottom: 12px; color: var(--muted); font-size: 8px; line-height: 1.6; }
.setting textarea, .setting input {
    width: 100%; padding: 11px; color: var(--text); background: #050a0f; border: 1px solid var(--line); outline: none; font-family: inherit; font-size: 10px;
}
.setting textarea { height: 130px; resize: vertical; }
.setting button { margin-top: 10px; padding: 9px 15px; color: var(--cyan); background: #103043; border: 1px solid var(--line-bright); font-family: inherit; font-size: 9px; cursor: pointer; }
.setting button:hover { background: #17445b; }

.mobile-menu { display: none; width: 38px; height: 38px; color: var(--cyan); background: transparent; border: 1px solid var(--line); cursor: pointer; font-size: 17px; }

#toast {
    position: fixed; left: 50%; bottom: 85px; transform: translateX(-50%) translateY(20px); z-index: 5000;
    padding: 10px 16px; color: var(--cyan); background: #09141d; border: 1px solid var(--line-bright);
    font-size: 9px; letter-spacing: 1px; opacity: 0; pointer-events: none; transition: .3s; max-width: 90%;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (max-width: 800px) {
    .sidebar { position: fixed; left: 0; top: 0; z-index: 3000; width: 265px; height: 100dvh; transform: translateX(-100%); transition: transform .3s ease; box-shadow: 15px 0 50px rgba(0,0,0,.55); }
    .sidebar.open { transform: translateX(0); }
    .mobile-menu { display: block; }
    .header { height: 62px; padding: 0 13px; }
    .header-left { gap: 9px; }
    .logo { font-size: 13px; letter-spacing: 4px; }
    .subtitle { font-size: 6px; letter-spacing: 1.5px; }
    .status { font-size: 7px; }
    .welcome-core { width: 105px; height: 105px; }
    .welcome h1 { font-size: 18px; letter-spacing: 5px; }
    .welcome p { font-size: 8px; }
    .message { max-width: 94%; font-size: 12px; }
    .input-area { padding: 8px 10px max(12px, env(safe-area-inset-bottom)); }
    #messageInput { font-size: 12px; }
    .action-btn { width: 42px; }
    .send { width: 46px; }
    .content-pad { padding: 20px 15px; }
}

@media (max-width: 430px) {
    .status span { display: none; }
    .logo { font-size: 12px; letter-spacing: 3px; }
    .message { max-width: 96%; padding: 11px 12px; }
    .input-area { gap: 5px; }
    .action-btn { width: 40px; }
    .send { width: 43px; }
}
</style>
</head>

<body>

<div class="grid-bg"></div>
<div class="background-glow"></div>
<div class="scanlines"></div>

<div id="loginScreen">
    <div class="login-reactor"><div class="reactor-core"></div></div>
    <div class="login-title">J.A.R.V.I.S</div>
    <div class="login-sub">JUST A RATHER VERY INTELLIGENT SYSTEM</div>
    <div class="login-line"></div>
    <div class="login-msg">AUTHENTICATION REQUIRED TO ACCESS NEURAL CORE</div>
    <a href="/login" class="google-btn">
        <img src="https://www.google.com/favicon.ico" alt="Google">
        SIGN IN WITH GOOGLE
    </a>
    <div class="login-footer">SECURE CONNECTION · ENCRYPTED SESSION</div>
</div>

<div id="splash" class="hidden">
    <div class="boot-ring"></div>
    <div class="boot-status" id="bootStatus">INITIALIZING NEURAL CORE...</div>
</div>

<div class="app" id="app">

    <aside class="sidebar" id="sidebar">
        <div class="avatar-box">
            <div class="avatar" id="avatarBox">◉</div>
            <div class="avatar-name" id="userName">USER</div>
            <div class="avatar-status">● SYSTEM ONLINE</div>
            <div class="logout-btn" onclick="window.location.href='/logout'">SIGN OUT</div>
        </div>

        <button class="new-chat-btn" onclick="newChat()">+ NEW CONVERSATION</button>

        <div class="nav-section-label">SYSTEM</div>

        <button class="nav-btn active" data-panel="chat" onclick="switchPanel('chat')">
            <span class="nav-icon">◈</span> CHAT
        </button>

        <button class="nav-btn" data-panel="memory" onclick="switchPanel('memory')">
            <span class="nav-icon">◇</span> MEMORY
        </button>

        <button class="nav-btn" data-panel="settings" onclick="switchPanel('settings')">
            <span class="nav-icon">⚙</span> SETTINGS
        </butt
