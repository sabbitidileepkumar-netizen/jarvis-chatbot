<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>J.A.R.V.I.S — AI Assistant</title>

<style>
/* =========================================================
   J.A.R.V.I.S
   FUTURISTIC AI ASSISTANT FRONTEND
   ========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --bg: #03070b;
    --panel: #071019;
    --panel2: #0b151f;
    --cyan: #55d9ff;
    --cyan2: #9aeaff;
    --text: #e5f7ff;
    --muted: #6b8492;
    --green: #48e28a;
    --red: #ff6670;
    --border: rgba(85,217,255,.18);
    --border-bright: rgba(85,217,255,.55);
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: "Courier New", monospace;
}

/* =========================================================
   BACKGROUND
   ========================================================= */

.background {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;

    background:
        radial-gradient(
            circle at 50% 45%,
            rgba(40,150,200,.12),
            transparent 32%
        ),
        radial-gradient(
            circle at 10% 90%,
            rgba(0,130,180,.06),
            transparent 30%
        ),
        #03070b;
}

.grid {
    position: absolute;
    inset: 0;
    opacity: .08;

    background-image:
        linear-gradient(rgba(85,217,255,.25) 1px, transparent 1px),
        linear-gradient(90deg, rgba(85,217,255,.25) 1px, transparent 1px);

    background-size: 40px 40px;

    mask-image: linear-gradient(
        to bottom,
        black,
        transparent 90%
    );
}

.scanlines {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 100;

    background: repeating-linear-gradient(
        to bottom,
        transparent 0,
        transparent 4px,
        rgba(255,255,255,.012) 5px
    );
}

/* =========================================================
   APP
   ========================================================= */

.app {
    position: relative;
    z-index: 2;

    width: 100%;
    height: 100vh;

    display: flex;
}

/* =========================================================
   SIDEBAR
   ========================================================= */

.sidebar {
    width: 245px;
    flex-shrink: 0;

    display: flex;
    flex-direction: column;

    background:
        linear-gradient(
            180deg,
            rgba(8,17,25,.98),
            rgba(3,8,13,.98)
        );

    border-right: 1px solid var(--border);
}

.profile {
    padding: 25px 15px 20px;

    text-align: center;

    border-bottom: 1px solid var(--border);
}

.avatar {
    width: 64px;
    height: 64px;

    margin: auto;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    border: 1px solid var(--border-bright);

    color: var(--cyan);
    font-size: 25px;

    background:
        radial-gradient(
            circle,
            rgba(85,217,255,.25),
            rgba(5,15,23,.9) 60%
        );

    box-shadow:
        0 0 20px rgba(85,217,255,.15),
        inset 0 0 20px rgba(85,217,255,.08);

    animation: reactorPulse 2.5s infinite;
}

@keyframes reactorPulse {
    50% {
        box-shadow:
            0 0 35px rgba(85,217,255,.3),
            inset 0 0 25px rgba(85,217,255,.15);
    }
}

.profile-name {
    margin-top: 12px;

    font-size: 11px;
    letter-spacing: 3px;

    color: var(--text);
}

.online {
    margin-top: 6px;

    color: var(--green);
    font-size: 8px;
    letter-spacing: 2px;
}

.online::before {
    content: "● ";
}

.new-chat {
    margin: 16px 12px 8px;
    padding: 12px;

    color: var(--cyan);

    background: rgba(85,217,255,.04);

    border: 1px solid var(--border);

    font-family: inherit;
    font-size: 9px;
    letter-spacing: 2px;

    cursor: pointer;
}

.new-chat:hover {
    border-color: var(--cyan);
    background: rgba(85,217,255,.08);
}

.sidebar-title {
    padding: 16px 15px 7px;

    color: #46616f;
    font-size: 8px;
    letter-spacing: 2px;
}

.history {
    flex: 1;
    overflow-y: auto;

    padding: 5px 10px;
}

.history::-webkit-scrollbar {
    width: 3px;
}

.history::-webkit-scrollbar-thumb {
    background: #24546a;
}

.history-item {
    padding: 10px;

    color: #6c8490;

    border-left: 2px solid transparent;

    font-size: 9px;

    cursor: pointer;

    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}

.history-item:hover {
    color: var(--text);
    background: rgba(85,217,255,.03);
}

.history-item.active {
    color: var(--cyan);
    border-left-color: var(--cyan);
    background: rgba(85,217,255,.05);
}

/* =========================================================
   MAIN
   ========================================================= */

.main {
    min-width: 0;
    flex: 1;

    display: flex;
    flex-direction: column;
}

/* =========================================================
   HEADER
   ========================================================= */

.header {
    height: 64px;
    flex-shrink: 0;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 25px;

    background: rgba(6,13,20,.92);

    border-bottom: 1px solid var(--border);

    backdrop-filter: blur(12px);
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;
}

.mini-reactor {
    width: 30px;
    height: 30px;

    display: flex;
    align-items: center;
    justify-content: center;

    border: 1px solid var(--border-bright);
    border-radius: 50%;

    box-shadow: 0 0 15px rgba(85,217,255,.15);
}

.mini-reactor::after {
    content: "";

    width: 9px;
    height: 9px;

    border-radius: 50%;

    background: var(--cyan);

    box-shadow: 0 0 12px var(--cyan);
}

.brand-name {
    font-size: 15px;
    font-weight: bold;
    letter-spacing: 5px;
}

.brand-sub {
    margin-top: 3px;

    color: #526b78;

    font-size: 7px;
    letter-spacing: 2px;
}

.system-status {
    display: flex;
    align-items: center;
    gap: 7px;

    color: var(--cyan);

    font-size: 8px;
    letter-spacing: 1px;
}

.status-dot {
    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: var(--green);

    box-shadow: 0 0 10px var(--green);
}

/* =========================================================
   CHAT
   ========================================================= */

.chat {
    flex: 1;
    min-height: 0;

    display: flex;
    flex-direction: column;
}

.messages {
    flex: 1;
    min-height: 0;

    overflow-y: auto;

    padding: 25px clamp(15px, 7vw, 90px);
}

.messages::-webkit-scrollbar {
    width: 5px;
}

.messages::-webkit-scrollbar-thumb {
    background: #24546a;
}

/* =========================================================
   WELCOME
   ========================================================= */

.welcome {
    min-height: 100%;

    display: flex;
    align-items: center;
    justify-content: center;

    text-align: center;
}

.welcome-content {
    max-width: 550px;
}

.core {
    width: 110px;
    height: 110px;

    margin: 0 auto 25px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    border: 1px solid var(--border-bright);

    box-shadow:
        0 0 35px rgba(85,217,255,.1),
        inset 0 0 30px rgba(85,217,255,.05);

    animation: float 4s ease-in-out infinite;
}

.core::after {
    content: "";

    width: 58px;
    height: 58px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            white 0%,
            var(--cyan) 28%,
            #12627b 62%,
            transparent 72%
        );

    box-shadow:
        0 0 25px var(--cyan),
        0 0 70px rgba(85,217,255,.3);
}

@keyframes float {
    50% {
        transform: translateY(-8px);
    }
}

.welcome h1 {
    font-size: 22px;
    letter-spacing: 5px;
}

.welcome p {
    margin-top: 10px;

    color: var(--muted);

    font-size: 9px;
    letter-spacing: 1px;
}

/* =========================================================
   MESSAGE
   ========================================================= */

.message {
    width: fit-content;
    max-width: min(800px, 94%);

    margin-bottom: 18px;

    padding: 13px 16px;

    background: rgba(8,16,24,.94);

    border: 1px solid var(--border);

    font-size: 13px;
    line-height: 1.65;

    overflow-wrap: anywhere;

    animation: messageIn .2s ease;
}

@keyframes messageIn {
    from {
        opacity: 0;
        transform: translateY(8px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.message.ai {
    border-left: 2px solid var(--cyan);
}

.message.user {
    margin-left: auto;

    border-right: 2px solid #688ca7;

    background: rgba(12,21,30,.96);
}

.message-header {
    display: flex;
    justify-content: space-between;
    gap: 25px;

    margin-bottom: 7px;
}

.sender {
    color: var(--cyan);

    font-size: 8px;
    letter-spacing: 2px;
}

.user .sender {
    color: #8baec8;
}

.time {
    color: #405560;
    font-size: 8px;
}

.message-body p {
    margin-bottom: 8px;
}

.message-body p:last-child {
    margin-bottom: 0;
}

.message-body ul,
.message-body ol {
    padding-left: 22px;
    margin: 8px 0;
}

.message-body strong {
    color: #f0fbff;
}

.message-body code {
    padding: 2px 5px;

    color: var(--cyan2);

    background: rgba(85,217,255,.08);
}

.message-body pre {
    margin: 10px 0;
    padding: 12px;

    overflow-x: auto;

    background: #020507;

    border: 1px solid rgba(85,217,255,.1);
}

.message-body pre code {
    padding: 0;
    background: transparent;
}

.actions {
    display: flex;
    gap: 13px;

    margin-top: 9px;
    padding-top: 7px;

    border-top: 1px solid rgba(85,217,255,.07);

    color: #405963;

    font-size: 8px;
    letter-spacing: 1px;
}

.actions button {
    color: inherit;
    background: transparent;
    border: none;

    font-family: inherit;
    font-size: inherit;

    cursor: pointer;
}

.actions button:hover {
    color: var(--cyan);
}

/* =========================================================
   TYPING
   ========================================================= */

.typing {
    display: none;

    width: fit-content;

    margin-bottom: 18px;
    padding: 13px 16px;

    background: rgba(8,16,24,.94);

    border: 1px solid var(--border);
    border-left: 2px solid var(--cyan);
}

.typing.visible {
    display: block;
}

.typing-label {
    margin-bottom: 8px;

    color: #55788a;

    font-size: 8px;
    letter-spacing: 2px;
}

.dots {
    display: flex;
    gap: 5px;
}

.dot {
    width: 5px;
    height: 5px;

    border-radius: 50%;

    background: var(--cyan);

    animation: typing 1.2s infinite;
}

.dot:nth-child(2) {
    animation-delay: .2s;
}

.dot:nth-child(3) {
    animation-delay: .4s;
}

@keyframes typing {
    0%, 60%, 100% {
        opacity: .25;
        transform: translateY(0);
    }

    30% {
        opacity: 1;
        transform: translateY(-4px);
    }
}

/* =========================================================
   INPUT
   ========================================================= */

.input-area {
    flex-shrink: 0;

    display: flex;
    gap: 7px;

    padding:
        10px
        clamp(15px, 7vw, 90px)
        20px;

    background:
        linear-gradient(
            to top,
            #03070b 70%,
            transparent
        );
}

.input-box {
    flex: 1;
    min-width: 0;

    display: flex;
    align-items: center;

    background: #071019;

    border: 1px solid var(--border);
}

.input-box:focus-within {
    border-color: var(--border-bright);

    box-shadow:
        0 0 20px rgba(85,217,255,.07);
}

#messageInput {
    width: 100%;

    padding: 13px;

    color: var(--text);
    background: transparent;

    border: none;
    outline: none;

    font-family: inherit;
    font-size: 13px;
}

#messageInput::placeholder {
    color: #425762;
}

.button {
    width: 46px;
    flex-shrink: 0;

    color: var(--cyan);

    background: #08131c;

    border: 1px solid var(--border);

    font-size: 15px;

    cursor: pointer;
}

.button:hover {
    border-color: var(--cyan);
    background: #0d202c;
}

.send {
    width: 50px;

    background: #0d3042;

    border-color: var(--border-bright);

    font-size: 17px;
}

.send:disabled {
    opacity: .4;
    cursor: not-allowed;
}

.mic.listening {
    color: var(--red);
    border-color: var(--red);

    animation: micPulse 1s infinite;
}

@keyframes micPulse {
    50% {
        box-shadow: 0 0 20px rgba(255,102,112,.25);
    }
}

/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 750px) {

    .sidebar {
        display: none;
    }

    .header {
        height: 58px;
        padding: 0 14px;
    }

    .brand-name {
        font-size: 13px;
        letter-spacing: 3px;
    }

    .brand-sub {
        font-size: 6px;
    }

    .system-status {
        font-size: 7px;
    }

    .messages {
        padding: 18px 12px;
    }

    .message {
        max-width: 96%;
        font-size: 13px;
    }

    .input-area {
        padding: 8px 10px 13px;
    }

    #messageInput {
        font-size: 12px;
    }

    .button {
        width: 42px;
    }

    .send {
        width: 45px;
    }

    .welcome h1 {
        font-size: 17px;
    }

    .core {
        width: 85px;
        height: 85px;
    }

    .core::after {
        width: 45px;
        height: 45px;
    }
}

/* =========================================================
   SMALL PHONES
   ========================================================= */

@media (max-width: 400px) {

    .system-status span {
        display: none;
    }

    .message {
        font-size: 12px;
    }

    .welcome p {
        padding: 0 20px;
    }
}
</style>
</head>

<body>

<div class="background">
    <div class="grid"></div>
</div>

<div class="scanlines"></div>

<div class="app">

    <!-- =====================================================
         SIDEBAR
         ===================================================== -->

    <aside class="sidebar">

        <div class="profile">

            <div class="avatar">
                ◈
            </div>

            <div class="profile-name">
                J.A.R.V.I.S
            </div>

            <div class="online">
                SYSTEM ONLINE
            </div>

        </div>

        <button class="new-chat" onclick="newChat()">
            + NEW CONVERSATION
        </button>

        <div class="sidebar-title">
            CONVERSATIONS
        </div>

        <div class="history" id="history">
            <div class="history-item active">
                Current conversation
            </div>
        </div>

    </aside>


    <!-- =====================================================
         MAIN
         ===================================================== -->

    <main class="main">

        <header class="header">

            <div class="brand">

                <div class="mini-reactor"></div>

                <div>
                    <div class="brand-name">
                        J.A.R.V.I.S
                    </div>

                    <div class="brand-sub">
                        JUST A RATHER VERY INTELLIGENT SYSTEM
                    </div>
                </div>

            </div>

            <div class="system-status">

                <div class="status-dot"></div>

                <span>SYSTEM ONLINE</span>

            </div>

        </header>


        <!-- =================================================
             CHAT
             ================================================= -->

        <section class="chat">

            <div class="messages" id="messages">

                <div class="welcome" id="welcome">

                    <div class="welcome-content">

                        <div class="core"></div>

                        <h1>
                            J.A.R.V.I.S
                        </h1>

                        <p>
                            READY TO ASSIST • ASK ME ANYTHING
                        </p>

                    </div>

                </div>

            </div>


            <!-- TYPING -->

            <div
                class="typing"
                id="typing"
            >

                <div class="typing-label">
                    J.A.R.V.I.S IS THINKING
                </div>

                <div class="dots">

                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>

                </div>

            </div>


            <!-- INPUT -->

            <div class="input-area">

                <div class="input-box">

                    <input
                        id="messageInput"
                        type="text"
                        autocomplete="off"
                        placeholder="Enter your command..."
                    >

                </div>

                <button
                    class="button mic"
                    id="micButton"
                    title="Voice input"
                    onclick="toggleVoice()"
                >
                    🎙
                </button>

                <button
                    class="button send"
                    id="sendButton"
                    title="Send"
                    onclick="sendMessage()"
                >
                    ➤
                </button>

            </div>

        </section>

    </main>

</div>


<script>
/* =========================================================
   J.A.R.V.I.S FRONTEND ENGINE
   ========================================================= */

const input = document.getElementById("messageInput");
const messages = document.getElementById("messages");
const typing = document.getElementById("typing");
const sendButton = document.getElementById("sendButton");
const micButton = document.getElementById("micButton");
const history = document.getElementById("history");

let conversation = [];


/* =========================================================
   TIME
   ========================================================= */

function getTime() {

    return new Date().toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit"
    });

}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHTML(text) {

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}


/* =========================================================
   BASIC MARKDOWN
   ========================================================= */

function formatResponse(text) {

    let safe = escapeHTML(text);

    safe = safe.replace(
        /```([\s\S]*?)```/g,
        "<pre><code>$1</code></pre>"
    );

    safe = safe.replace(
        /\*\*(.*?)\*\*/g,
        "<strong>$1</strong>"
    );

    safe = safe.replace(
        /`([^`]+)`/g,
        "<code>$1</code>"
    );

    safe = safe.replace(
        /\n/g,
        "<br>"
    );

    return safe;

}


/* =========================================================
   ADD MESSAGE
   ========================================================= */

function addMessage(text, type) {

    const welcome = document.getElementById("welcome");

    if (welcome) {
        welcome.remove();
    }

    const message = document.createElement("div");

    message.className =
        "message " + type;

    const sender =
        type === "ai"
            ? "J.A.R.V.I.S"
            : "YOU";

    message.innerHTML = `

        <div class="message-header">

            <span class="sender">
                ${sender}
            </span>

            <span class="time">
                ${getTime()}
            </span>

        </div>

        <div class="message-body">
            ${formatResponse(text)}
        </div>

        ${
            type === "ai"
            ? `
            <div class="actions">

                <button onclick="copyMessage(this)">
                    COPY
                </button>

                <button onclick="speakMessage(this)">
                    SPEAK
                </button>

            </div>
            `
            : ""
        }

    `;

    messages.appendChild(message);

    scrollToBottom();

    return message;

}


/* =========================================================
   SCROLL
   ========================================================= */

function scrollToBottom() {

    requestAnimationFrame(() => {

        messages.scrollTop =
            messages.scrollHeight;

    });

}


/* =========================================================
   SEND MESSAGE
   ========================================================= */

async function sendMessage() {

    const text =
        input.value.trim();

    if (!text) return;

    input.value = "";

    addMessage(text, "user");

    conversation.push({
        role: "user",
        content: text
    });

    setLoading(true);

    try {

        const response =
            await fetch("/chat", {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    message: text
                })

            });


        if (!response.ok) {

            throw new Error(
                "Server returned " +
                response.status
            );

        }


        const data =
            await response.json();


        /*
         * Supports several common Flask
         * response formats.
         */

        const reply =
            data.response ??
            data.reply ??
            data.message ??
            data.text ??
            "J.A.R.V.I.S received an empty response.";


        addMessage(
            String(reply),
            "ai"
        );


        conversation.push({
            role: "assistant",
            content: String(reply)
        });


        updateHistory(text);


    } catch (error) {

        console.error(error);

        addMessage(
            "Connection error. J.A.R.V.I.S could not reach the backend. Please check your Render logs and Flask /chat endpoint.",
            "ai"
        );

    } finally {

        setLoading(false);

    }

}


/* =========================================================
   LOADING
   ========================================================= */

function setLoading(state) {

    typing.classList.toggle(
        "visible",
        state
    );

    sendButton.disabled = state;

    if (state) {
        scrollToBottom();
    }

}


/* =========================================================
   ENTER KEY
   ========================================================= */

input.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =========================================================
   NEW CHAT
   ========================================================= */

function newChat() {

    conversation = [];

    messages.innerHTML = `

        <div class="welcome" id="welcome">

            <div class="welcome-content">

                <div class="core"></div>

                <h1>
                    J.A.R.V.I.S
                </h1>

                <p>
                    READY TO ASSIST • ASK ME ANYTHING
                </p>

            </div>

        </div>

    `;

    input.focus();

}


/* =========================================================
   HISTORY
   ========================================================= */

function updateHistory(text) {

    const existing =
        history.querySelector(
            ".history-item.active"
        );

    if (existing) {

        existing.textContent =
            text.substring(0, 28);

        return;

    }

    const item =
        document.createElement("div");

    item.className =
        "history-item active";

    item.textContent =
        text.substring(0, 28);

    history.appendChild(item);

}


/* =========================================================
   COPY
   ========================================================= */

async function copyMessage(button) {

    const message =
        button.closest(".message");

    const body =
        message.querySelector(
            ".message-body"
        );

    try {

        await navigator.clipboard.writeText(
            body.innerText
        );

        const old =
            button.textContent;

        button.textContent =
            "COPIED";

        setTimeout(() => {

            button.textContent = old;

        }, 1200);

    } catch {

        button.textContent =
            "COPY FAILED";

    }

}


/* =========================================================
   TEXT TO SPEECH
   ========================================================= */

function speakMessage(button) {

    const message =
        button.closest(".message");

    const body =
        message.querySelector(
            ".message-body"
        );

    const text =
        body.innerText;

    if (!("speechSynthesis" in window)) {

        alert(
            "Text-to-speech is not supported by this browser."
        );

        return;

    }

    speechSynthesis.cancel();

    const speech =
        new SpeechSynthesisUtterance(text);

    speech.rate = 1;
    speech.pitch = 1;
    speech.volume = 1;

    speechSynthesis.speak(speech);

}


/* =========================================================
   VOICE RECOGNITION
   ========================================================= */

let recognition = null;
let listening = false;

function setupVoice() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!SpeechRecognition) {

        return false;

    }

    recognition =
        new SpeechRecognition();

    recognition.lang =
        navigator.language || "en-US";

    recognition.continuous = false;

    recognition.interimResults = false;


    recognition.onstart = function() {

        listening = true;

        micButton.classList.add(
            "listening"
        );

    };


    recognition.onresult =
        function(event) {

            const transcript =
                event.results[0][0].transcript;

            input.value =
                transcript;

        };


    recognition.onerror =
        function(event) {

            console.error(
                "Voice error:",
                event.error
            );

        };


    recognition.onend = function() {

        listening = false;

        micButton.classList.remove(
            "listening"
        );

    };

    return true;

}


function toggleVoice() {

    if (!recognition) {

        const supported =
            setupVoice();

        if (!supported) {

            alert(
                "Voice input is not supported in this browser."
            );

            return;

        }

    }


    if (listening) {

        recognition.stop();

    } else {

        recognition.start();

    }

}


/* =========================================================
   STARTUP
   ========================================================= */

window.addEventListener(
    "load",
    function() {

        input.focus();

        console.log(
            "J.A.R.V.I.S frontend initialized."
        );

    }
);
