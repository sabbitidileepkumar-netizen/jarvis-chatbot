<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family: Arial, Helvetica, sans-serif; }

body {
    background:#020508;
    color:#d9f7ff;
    height:100vh;
    overflow:hidden;
}

.hud {
    position:relative;
    width:100%;
    height:100vh;
    background: radial-gradient(circle at center, #062235 0%, #02070b 40%, #000 85%);
}

.header {
    height:80px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 30px;
    border-bottom:1px solid rgba(0,191,255,.3);
}

.logo { font-size:24px; font-weight:bold; letter-spacing:4px; color:#e8fbff; text-shadow:0 0 10px #00bfff; }
.subtitle { font-size:10px; letter-spacing:3px; color:#009dff; margin-top:4px; }

.status { display:flex; align-items:center; gap:8px; color:#00eaff; font-size:12px; }
.status-dot { width:9px; height:9px; background:#00ff88; border-radius:50%; box-shadow:0 0 10px #00ff88; }

.chat-area {
    height:calc(100vh - 80px);
    position:relative;
    display:flex;
    flex-direction:column;
}

.reactor {
    position:absolute;
    width:400px; height:400px;
    left:50%; top:50%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    opacity:.2;
    pointer-events:none;
}
.reactor::before, .reactor::after {
    content:""; position:absolute; border-radius:50%; inset:0;
    border:2px solid #00bfff;
    box-shadow:0 0 15px #00bfff, inset 0 0 20px #0077ff;
}
.reactor::after { inset:45px; border:8px dotted #00c8ff; animation:rotate 12s linear infinite; }
.reactor-core {
    position:absolute; width:90px; height:90px; left:50%; top:50%;
    transform:translate(-50%,-50%); border-radius:50%;
    background:radial-gradient(circle, white 0%, #70eaff 20%, #00bfff 45%, #006eff 70%, transparent 72%);
    box-shadow:0 0 30px #00d9ff, 0 0 70px #008cff;
    animation:pulse 2s infinite alternate;
}
@keyframes rotate { from{transform:rotate(0deg);} to{transform:rotate(360deg);} }
@keyframes pulse { from{transform:translate(-50%,-50%) scale(.9);} to{transform:translate(-50%,-50%) scale(1.08);} }

.messages { flex:1; overflow-y:auto; padding:25px 6%; position:relative; z-index:2; }
.messages::-webkit-scrollbar { width:5px; }
.messages::-webkit-scrollbar-thumb { background:#008cff; }

.message {
    max-width:600px; margin-bottom:18px; padding:14px 18px;
    border:1px solid rgba(0,190,255,.4);
    background:rgba(2,16,27,.85);
    line-height:1.5; font-size:14px;
}
.message.ai { border-left:3px solid #00bfff; margin-right:auto; }
.message.user { border-right:3px solid #0077ff; margin-left:auto; text-align:right; }
.sender { font-size:10px; letter-spacing:2px; color:#00bfff; margin-bottom:6px; }

.input-area { padding:15px 6% 20px; display:flex; gap:10px; z-index:4; position:relative; }
.input-box {
    flex:1; display:flex; align-items:center;
    border:1px solid #008cff;
    background:rgba(0,10,18,.9);
    box-shadow:0 0 10px rgba(0,140,255,.2);
}
#messageInput {
    flex:1; padding:14px; background:transparent; border:none; outline:none;
    color:#fff; font-size:14px;
}
#messageInput::placeholder { color:#527b8c; }
button { border:none; cursor:pointer; }
.send {
    width:52px; background:#008cff; color:#fff; font-size:20px;
    box-shadow:0 0 15px #0077ff;
}
.send:hover { background:#00c8ff; }
.send:disabled { opacity:.5; cursor:not-allowed; }

@media(max-width:700px) {
    .reactor { width:280px; height:280px; }
    .messages { padding:20px 12px; }
}
</style>
</head>
<body>

<div class="hud">

    <header class="header">
        <div>
            <div class="logo">J.A.R.V.I.S</div>
            <div class="subtitle">AI ASSISTANT SYSTEM</div>
        </div>
        <div class="status">
            <span class="status-dot"></span> ONLINE
        </div>
    </header>

    <section class="chat-area">
        <div class="reactor"><div class="reactor-core"></div></div>

        <div class="messages" id="messages">
            <div class="message ai">
                <div class="sender">JARVIS</div>
                Hello. System initialized successfully. How may I assist you?
            </div>
        </div>

        <div class="input-area">
            <div class="input-box">
                <input id="messageInput" type="text" placeholder="Type your message..." autocomplete="off">
            </div>
            <button class="send" id="sendBtn" onclick="sendMessage()">➤</button>
        </div>
    </section>
</div>

<script>
const input = document.getElementById("messageInput");
const messages = document.getElementById("messages");
const sendBtn = document.getElementById("sendBtn");

input.addEventListener("keydown", function(e) {
    if (e.key === "Enter" && !sendBtn.disabled) sendMessage();
});

function addMessage(text, type) {
    const message = document.createElement("div");
    message.className = "message " + type;
    const sender = type === "ai" ? "JARVIS" : "YOU";
    message.innerHTML = `<div class="sender">${sender}</div>${escapeHTML(text)}`;
    messages.appendChild(message);
    messages.scrollTop = messages.scrollHeight;
}

async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;

    addMessage(text, "user");
    input.value = "";
    sendBtn.disabled = true;

    try {
        const response = await fetch("/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: text })
        });

        if (!response.ok) throw new Error("Server error");

        const data = await response.json();
        addMessage(data.reply || "I received your message.", "ai");

    } catch (error) {
        console.error(error);
        addMessage("⚠ Connection to AI system failed.", "ai");
    } finally {
        sendBtn.disabled = false;
        input.focus();
    }
}

function escapeHTML(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
}
</script>

</body>
</html>
